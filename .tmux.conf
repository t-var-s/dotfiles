# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Start each conditional branch with run-shell true: stock 1.8 can otherwise
# free if-shell callback data before the shell job has finished using it.
# Check the binary version without connecting to a server still loading config.
# Mouse: tmux 2.1+ has one option; 1.8-2.0 uses separate options.
if-shell 'case "$(tmux -V)" in "tmux 1."*|"tmux 2.0"*) exit 1 ;; *) exit 0 ;; esac' \
    'run-shell true ; set -g mouse on' \
    'run-shell true ; set -g mouse-select-pane on ; set -g mouse-resize-pane on ; set -g mouse-select-window on ; set -g mode-mouse on'

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Minimal status
set -g status-left ""

# Centered workspace: approximately 20% | 60% | 20%; prefix-z zooms.
# Only create it when the window currently has one pane.
# Split off the right margin, then a large middle pane, and swap the original
# shell into the middle. This avoids split-window -b (introduced in 2.0).
# In 1.8, -c "" inherits the current pane directory; 1.9+ uses a path format.
if-shell 'case "$(tmux -V)" in "tmux 1.8"*) exit 0 ;; *) exit 1 ;; esac' \
    "run-shell true ; bind m if-shell '[ \"#{window_panes}\" -eq 1 ]' 'run-shell true ; split-window -h -d -p 20 -c \"\" ; split-window -h -p 75 -c \"\" ; swap-pane -U ; select-pane -R' 'run-shell true ; display-message \"Layout already has multiple panes\"'" \
    "run-shell true ; bind m if-shell '[ \"#{window_panes}\" -eq 1 ]' 'run-shell true ; split-window -h -d -p 20 -c \"#{pane_current_path}\" ; split-window -h -p 75 -c \"#{pane_current_path}\" ; swap-pane -U ; select-pane -R' 'run-shell true ; display-message \"Layout already has multiple panes\"'"

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Mouse
set -g mouse on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Minimal status
set -g status-left ""

# Centered workspace: 20% | 60% | 20% - can be toggled with prefix-z 
# Only create it when the window currently has one pane.
bind m if-shell -F '#{==:#{window_panes},1}' \
    'split-window -h -d -p 20 -c "#{pane_current_path}" ; split-window -h -d -b -p 25 -c "#{pane_current_path}"' \
    'display-message "Layout already has multiple panes"'
